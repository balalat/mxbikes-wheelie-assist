; Wheelie Assist for MX Bikes. Lives in the game's plugins folder next to wheelie_assist64.dlo/.dli.
; Works with your own control setup: it reads where throttle, rear brake and rider lean F/B are bound
; in the game's control settings and only touches those, only while it is helping.
; [assist] values are re-read every time you go on track; [input] values need a game restart.

[assist]
enabled = 1              ; assist on at game start
start_preset = normal    ; gentle | normal | high | protection | custom. Change in game (see [input])
allow_online = 0         ; 1 = also work on online servers. Off by default: it's an advantage in races
throttle_hover = 0.55    ; initial guess of the throttle that holds the target (adapts while wheeling)
ki = 0.03                ; how fast throttle_hover adapts. 0 = off
min_speed = 1.5          ; m/s
pitch_sign = -1          ; MX Bikes: nose up = negative pitch (verified in game)
ground_tau = 0.3         ; seconds. smoothing of the ground slope estimate
; the 'custom' preset (preset 5):
target_angle = 35        ; wheelie angle to hold, degrees above the ground slope
max_angle = 65           ; hard cut-off: throttle zero, lean forward, strong rear brake above this
engage_angle = 6         ; assist does nothing below this angle
kp = 0.035               ; throttle removed per degree of predicted overshoot
lookahead = 0.30         ; seconds. how far ahead the nose angle is predicted
brake_start = 2          ; degrees of predicted overshoot before the rear brake helps
brake_gain = 0.06        ; rear brake per degree beyond brake_start. 0 = never brake
lean_start = 8           ; degrees of predicted error before the rider leans. Keep above brake_start: brake acts first
lean_gain = 0.06         ; rider lean per degree beyond lean_start (forward when too high, back when too low)

[input]
; Xbox-style pad (XInput): ls rs lb rb a b x y start back dpad_up dpad_down dpad_left dpad_right none
toggle_button = ls
preset_up_button = dpad_up
preset_down_button = dpad_down
; keyboard (any controller): f1..f24, a letter/digit, a virtual-key number, or none
toggle_key = f6
preset_down_key = f7
preset_up_key = f8
lean_invert = 0          ; 1 if the assist leans the rider the wrong way with your lean binding

[log]
enabled = 0              ; CSV logs in Documents\PiBoSo\MX Bikes\wheelie_logs

[hud]
enabled = 1
x = 0.965
y = 0.30
height = 0.35
